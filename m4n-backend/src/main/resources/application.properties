# Application Information
spring.application.name=m4n-backend

# Gmail app password is supplied only to the backend process.
m4n.auth.otp-email.enabled=${OTP_EMAIL_ENABLED:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
m4n.pos.invoice-email.enabled=${POS_INVOICE_EMAIL_ENABLED:true}

# Server Configuration
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=52MB
m4n.media.directory=${PRODUCT_IMAGE_DIRECTORY:./data/product-images}
m4n.media.public-base-url=${PRODUCT_IMAGE_PUBLIC_BASE_URL:http://localhost:8080/api/v1/media}
m4n.shipping.ghn.enabled=${GHN_ENABLED:false}
m4n.shipping.ghn.production=${GHN_PRODUCTION:false}
m4n.shipping.ghn.token=${GHN_TOKEN:}
m4n.shipping.ghn.shop-id=${GHN_SHOP_ID:0}

# PostgreSQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/m4n_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SpringDoc OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Centralized CORS Configuration
m4n.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT & Refresh Authentication Configuration
m4n.jwt.secret=${JWT_SECRET}
m4n.jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:15}
m4n.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
m4n.auth.password-reset-expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
m4n.auth.cookie.secure=${COOKIE_SECURE:false}
m4n.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Development Data Seeding (idempotent role & dev accounts)
m4n.seed.dev-accounts=${SEED_DEV_ACCOUNTS:false}

# Optional external reset delivery; secrets are supplied by the deployment.
m4n.auth.reset-email.enabled=${RESET_EMAIL_ENABLED:false}
m4n.auth.reset-email.api-key=${RESEND_API_KEY:}
m4n.auth.reset-email.from=${RESET_EMAIL_FROM:}
m4n.bootstrap.admin.enabled=${INITIAL_ADMIN_ENABLED:false}
m4n.bootstrap.admin.email=${INITIAL_ADMIN_EMAIL:}
m4n.bootstrap.admin.full-name=${INITIAL_ADMIN_FULL_NAME:}
m4n.bootstrap.admin.password=${INITIAL_ADMIN_PASSWORD:}

# VNPay 2.1.0 sandbox only; disabled until real sandbox credentials and HTTPS callbacks are configured.
m4n.payment.vnpay.enabled=${VNPAY_ENABLED:false}
m4n.payment.vnpay.merchant-code=${VNPAY_TMN_CODE:}
m4n.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
m4n.payment.vnpay.return-url=${VNPAY_RETURN_URL:}
m4n.payment.vnpay.ipn-url=${VNPAY_IPN_URL:}
m4n.payment.vnpay.server-ip=${VNPAY_SERVER_IP:}
m4n.payment.momo.enabled=${MOMO_ENABLED:false}
# Explicit opt-in for the approved hosted demo; gateway remains sandbox-only.
m4n.payment.momo.sandbox-deployment-enabled=${MOMO_SANDBOX_DEPLOYMENT_ENABLED:false}
m4n.payment.momo.partner-code=${MOMO_PARTNER_CODE:}
m4n.payment.momo.access-key=${MOMO_ACCESS_KEY:}
m4n.payment.momo.secret-key=${MOMO_SECRET_KEY:}
m4n.payment.momo.redirect-url=${MOMO_REDIRECT_URL:}
m4n.payment.momo.ipn-url=${MOMO_IPN_URL:}

# Optional explicit readable TTF with Vietnamese glyph support for embedded invoice fonts.
m4n.pdf.font-path=${INVOICE_PDF_FONT_PATH:}

