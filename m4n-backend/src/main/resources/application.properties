spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# SpringDoc OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Centralized CORS Configuration
m4n.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT & Refresh Authentication Configuration
m4n.jwt.secret=${JWT_SECRET:m4n-vietnamese-traditional-musical-instruments-super-secure-jwt-secret-key-2026}
m4n.jwt.access-expiration-minutes=${JWT_ACCESS_EXPIRATION_MINUTES:15}
m4n.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}
m4n.auth.password-reset-expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
m4n.auth.cookie.secure=${COOKIE_SECURE:false}
m4n.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Development Data Seeding (idempotent role & dev accounts)
m4n.seed.dev-accounts=${SEED_DEV_ACCOUNTS:true}

