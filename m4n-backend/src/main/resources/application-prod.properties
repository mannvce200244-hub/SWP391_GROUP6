# Activate explicitly with SPRING_PROFILES_ACTIVE=prod after applying reviewed SQL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
m4n.auth.cookie.secure=true
server.servlet.session.cookie.secure=true
m4n.seed.dev-accounts=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.forward-headers-strategy=none
m4n.frontend.url=${FRONTEND_URL}
m4n.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
m4n.media.directory=${PRODUCT_IMAGE_DIRECTORY}
m4n.media.public-base-url=${PRODUCT_IMAGE_PUBLIC_BASE_URL}
