# Explicit test fixtures; integration tests still require a configured PostgreSQL test database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/m4n_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
m4n.jwt.secret=m4n-only-test-signing-key-never-use-for-deployment-2026
m4n.jwt.access-expiration-minutes=15
m4n.jwt.refresh-expiration-days=7
m4n.auth.password-reset-expiration-minutes=15
m4n.auth.cookie.secure=false
m4n.cors.allowed-origins=http://localhost:5173
m4n.seed.dev-accounts=true
M4N_DEFAULT_TEST_PASSWORD=Password123!
